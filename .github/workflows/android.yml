name: Build XLSMART APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          mkdir project
          unzip -q XLSMART-Registration-v2-Android-Project.zip -d project
          PROJECT_DIR="$(dirname "$(find project -name settings.gradle -print -quit)")"
          gradle -p "$PROJECT_DIR" assembleDebug
          find project -name app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: XLSMART-Registration-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          
